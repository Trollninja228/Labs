<h1>Магазин</h1>

<div class="categories">
  <button 
    *ngFor="let cat of categories" 
    (click)="selectCategory(cat)"
    [class.selected]="selectedCategory?.id === cat.id">
    {{ cat.name }}
  </button>
</div>

<div class="products" *ngIf="selectedCategory">
  <h2>Товары категории "{{ selectedCategory.name }}"</h2>
  <app-product-list [products]="selectedCategory.products"></app-product-list>
</div>
