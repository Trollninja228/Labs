<div class="product-list">
    <div *ngFor="let product of products" class="product-card">
      <!-- Основное изображение товара -->
      <img [src]="product.image" [alt]="product.name">
      
      <!-- Название товара -->
      <h3>{{ product.name }}</h3>
      
      <!-- Описание товара -->
      <p>{{ product.description }}</p>
      
      <!-- Рейтинг товара -->
      <p>Рейтинг: {{ product.rating }} ★</p>
      
      <!-- Ссылка на товар на kaspi.kz -->
      <a [href]="product.link" target="_blank">Купить на Kaspi.kz</a>

      <!-- Галерея изображений, если она есть -->
      <div class="gallery" *ngIf="product.gallery && product.gallery.length">
        <img *ngFor="let img of product.gallery" [src]="img" [alt]="product.name">
      </div>

      <!-- Кнопки "Поделиться" -->
      <div class="share-buttons">
        <a [href]="'https://wa.me/?text=' + encodeURIComponent(product.link)" target="_blank">
            Поделиться в WhatsApp
          </a>
        <a [href]="'https://t.me/share/url?url=' + encodeURIComponent(product.link)" target="_blank">
          Поделиться в Telegram
        </a>
      </div>
    </div>
  </div>
